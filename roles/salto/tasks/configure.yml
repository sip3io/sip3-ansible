- name: "SIP3 Salto centralised config"
  ansible.builtin.copy:
    content: "{{ item['value'] }}"
    dest: "{{ item['name'] }}"
  loop:
    - name: "/etc/sip3-salto/application.yml"
      value: "{{ salto.application | to_nice_yaml }}"
    - name: "/etc/sip3-salto/environment.conf"
      value: "{{ salto.environment }}"
    - name: "/etc/sip3-salto/logback.xml"
      value: "{{ salto.logback }}"

- name: "Restart SIP3 Salto"
  systemd:
    name: sip3-salto
    daemon_reload: true
    state: restarted
    enabled: true
