-  name: "Gather the package facts"
   ansible.builtin.package_facts:
     manager: auto

-  name: "Check necessary Python packages for Ansible"
   debug:
     msg: "Current system doesn't have necessary package. You should install python3-rpm or python3-dnf packages. E.g. `sudo yum install python3-rpm` or `sudo dnf install python3-dnf`"
   when: ('python3-rpm' not in ansible_facts.packages and 'python3-dnf' not in ansible_facts.packages)

- name: "Add SIP3 CE repository"
  yum_repository:
    name: sip3-ce
    description: "SIP3 Community repository"
    baseurl: https://repo.sip3.io/yum/ce/
    gpgkey: https://repo.sip3.io/yum/keyFile
    gpgcheck: yes

- name: "Add Java repo"
  yum_repository:
    name: sip3-java
    description: "SIP3 Java repository"
    baseurl: https://repo.sip3.io/yum/java/$basearch/
    gpgkey: https://repo.sip3.io/yum/keyFile
    gpgcheck: yes
