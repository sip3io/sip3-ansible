- name: "Role repo"
  block:
    - name: "Install SIP3 repo for CentOS"
      ansible.builtin.include_tasks: centos.yml
      when:
        - ansible_facts['distribution'] | lower in ["redhat", "centos", "sangoma", "oracle", "rocky", "amazon"]

    - name: "Install SIP3 repo for Debian"
      ansible.builtin.include_tasks: debian.yml
      when:
        - ansible_facts['distribution'] | lower in ["debian", "ubuntu"]
  when:
    - salto.mode | lower in ["full", "repo", "package"]
    - captain.mode | lower in ["full", "repo", "package"]
    - twig.mode | lower in ["full", "repo", "package"]
    - hoof.mode | lower in ["full", "repo", "package"]