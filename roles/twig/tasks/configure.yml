- name: "SIP3 Twig config"
  ansible.builtin.copy:
    content: "{{ item['value'] }}"
    dest: "{{ item['name'] }}"
  loop:
    - name: "/etc/sip3-twig/application.yml"
      value: "{{ twig.application | to_nice_yaml }}"
    - name: "/etc/sip3-twig/environment.conf"
      value: "{{ twig.environment }}"
    - name: "/etc/sip3-twig/logback.xml"
      value: "{{ twig.logback }}"

- name: "Restart SIP3 Twig"
  systemd:
    name: sip3-twig
    daemon_reload: true
    state: restarted
    enabled: true