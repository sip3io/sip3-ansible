- name: "Install SIP3 Twig for CentOS"
  ansible.builtin.include_tasks: centos.yml
  when:
    - ansible_facts['distribution'] | lower in ["redhat", "centos", "sangoma", "oracle", "rocky", "amazon"]
    - twig.mode | lower in ["full", "package"]

- name: "Install SIP3 Twig for Debian"
  ansible.builtin.include_tasks: debian.yml
  when:
    - ansible_facts['distribution'] | lower in ["debian", "ubuntu"]
    - twig.mode | lower in ["full", "package"]

- name: "Configure SIP3 Twig"
  ansible.builtin.include_tasks: configure.yml
  when:
    - twig.mode | lower in ["full", "config"]
