-  name: "Gather the package facts"
   ansible.builtin.package_facts:
     manager: auto

-  name: "Install gnupg packages"
   apt:
     name: gnupg
     update_cache: yes
   when: ('gnupg' not in ansible_facts.packages)

- name: "Create apt keyrings directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: "Add signing key for Mongo repository"
  ansible.builtin.get_url:
    url: "https://www.mongodb.org/static/pgp/server-{{ version }}.asc"
    dest: "/etc/apt/keyrings/mongodb-server-{{ version }}.asc"
    mode: '0644'
    force: true

- name: "Add MongoDB repository Debian 12+"
  apt_repository:
    repo: "deb [ arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-{{ version }}.asc ] https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }} bookworm/mongodb-org/{{ version }} main"
    state: present
    filename: mongodb-org-{{ version }}
  when: ansible_facts['distribution'] | lower == "debian" and ansible_facts['distribution_major_version'] | int >= 11

- name: "Add MongoDB repository Debian"
  apt_repository:
    repo: "deb [ arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-{{ version }}.asc ] https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_distribution_release }}/mongodb-org/{{ version }} main"
    state: present
    filename: mongodb-org-{{ version }}
  when: ansible_facts['distribution'] | lower == "debian" and ansible_facts['distribution_major_version'] | int <= 11

- name: "Add MongoDB repository Ubuntu"
  apt_repository:
    repo: "deb [ arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-{{ version }}.asc ] https://repo.mongodb.org/apt/{{ ansible_facts['distribution'] | lower }} {{ ansible_distribution_release }}/mongodb-org/{{ version }} multiverse"
    state: present
    filename: mongodb-org-{{ version }}
  when: ansible_facts['distribution'] | lower == "ubuntu"

- name: "Install the latest version of MongoDB"
  apt:
    pkg:
      - mongodb-org
    update_cache: yes

- name: Get mongodb user info, no error if missing
  getent:
    database: passwd
    key: mongodb
    fail_key: False

- name: use mongodb
  set_fact:
    mongo_user: "mongodb"
  when: getent_passwd.mongodb[0] is defined

- name: use mongodb
  set_fact:
    mongo_user: "mongod"
  when: getent_passwd.mongodb[0] is not defined

- name: "Creates directory {{ mongodb.config.storage.dbPath | default('/data/db') }} for MongoDB"
  file:
    path: "{{ mongodb.config.storage.dbPath | default('/data/db') }}"
    state: directory
    mode: 0755
    group: "{{ mongo_user }}"
    owner: "{{ mongo_user }}"

- name: "Create directory '/var/run/mongodb' for MongoDB"
  file:
    path: "/var/run/mongodb"
    state: directory
    mode: 0755
    group: "{{ mongo_user }}"
    owner: "{{ mongo_user }}"

- name: "Deploying MongoDB tmpfs and logrotate configs"
  copy:
    src: "{{ item.name }}"
    dest: "/{{ item.name }}"
    owner: "{{ item.ownership }}"
    group: "{{ item.ownership }}"
    mode: "0644"
    backup: "{{ item.backup }}"
  loop:
    - { name: "usr/lib/tmpfiles.d/mongodb.conf", ownership: "root", backup: "no" }
    - { name: "etc/logrotate.d/mongod", ownership: "root", backup: "no" }