- name: Disable SELinux
  selinux:
    state: disabled

- name: "Add MongoDB repository"
  yum_repository:
    name: mongodb-org-{{ version }}
    description: "MongoDB Repository"
    baseurl: https://repo.mongodb.org/yum/amazon/2023/mongodb-org/7.0/x86_64/
    gpgcheck: no
    proxy: "{{ proxy | default('_none_') }}"

- name: "Install the latest version of MongoDB"
  yum:
    name: "{{ packages }}"
    update_cache: yes
  vars:
    packages:
      - mongodb-org-server
      - mongodb-mongosh

- name: Get mongodb user info, no error if missing
  getent:
    database: passwd
    key: mongodb
    fail_key: False

- name: use mongodb
  set_fact:
    mongo_user: "mongodb"
  when: getent_passwd.mongodb[0] is defined

- name: use mongodb
  set_fact:
    mongo_user: "mongod"
  when: getent_passwd.mongodb[0] is not defined

- name: "Creates directory {{ mongodb.config.path | default('/data/db') }} for MongoDB"
  file:
    path: "{{ mongodb.config.path | default('/data/db') }}"
    state: directory
    mode: 0755
    group: "{{ mongo_user }}"
    owner: "{{ mongo_user }}"

- name: "Create directory '/var/run/mongodb' for MongoDB"
  file:
    path: "/var/run/mongodb"
    state: directory
    mode: 0755
    group: "{{ mongo_user }}"
    owner: "{{ mongo_user }}"

- name: "Deploying MongoDB tmpfs and logrotate configs"
  copy:
    src: "{{ item.name }}"
    dest: "/{{ item.name }}"
    owner: "{{ item.ownership }}"
    group: "{{ item.ownership }}"
    mode: "0644"
    backup: "{{ item.backup }}"
  loop:
    - { name: "usr/lib/tmpfiles.d/mongodb.conf", ownership: "root", backup: "no" }
    - { name: "etc/logrotate.d/mongod", ownership: "root", backup: "no" }