- name: "Create MongoDB config"
  ansible.builtin.copy:
    content: "{{ item['value'] }}"
    dest: "{{ item['name'] }}"
  loop:
    - name: "/etc/mongod.conf"
      value: "{{ mongodb.config }}"

- name: "Restart MongoDB"
  systemd:
    name: mongod
    daemon_reload: true
    state: restarted
    enabled: true

- name: "Wait for MongoDB service starts"
  wait_for:
    host: "127.0.0.1"
    port: "{{ mongodb.config.net.port | default('27017') }}"
    delay: 1
    timeout: 15

- name: "Create index for hostmap"
  ansible.builtin.command: "{{ mongosh }} --host 127.0.0.1 {{ twig.application.mongo.management.db | default('sip3-mgmt') }} --port {{ mongodb.config.net.port | default('27017') }} --eval 'db.hosts.createIndex({ \"name\": 1 })'"
