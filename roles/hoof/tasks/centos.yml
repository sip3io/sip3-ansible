- name: "Installing"
  block:
    - name: "Add NGINX repository"
      yum_repository:
        name: nginx
        description: NGINX Repository
        baseurl: http://nginx.org/packages/mainline/rhel/$releasever/$basearch/
        gpgcheck: no
        proxy: "{{ proxy | default('_none_') }}"

    - name: "Install Nginx"
      yum:
        name:
          - nginx
        update_cache: yes
        state: latest
  when:
    - state == "started"
    - hoof.nginx is defined

- name: "Install SIP3 Hoof"
  yum:
    name:
      - "sip3-hoof-ce"
    update_cache: yes
    state: latest

