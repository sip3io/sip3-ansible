- name: "Installing"
  block:
    - name: "Add repositories"
      block:
        - name: "Install gnupg packages"
          apt:
            pkg:
              - gnupg
            update_cache: yes

        - name: "Add signing key for NGINX repository"
          apt_key:
            url: "https://nginx.org/keys/nginx_signing.key"
            state: present

        - name: "Add NGINX repository"
          apt_repository:
            repo: deb http://nginx.org/packages/mainline/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['lsb']['codename'] }} nginx
            state: present
            filename: nginx

        - name: "Install Nginx"
          apt:
            name:
              - nginx
            update_cache: yes
            state: latest
  when:
    - state == "started"
    - hoof.nginx is defined

- name: "Install SIP3 Hoof"
  apt:
    name:
      - "sip3-hoof-ce"
    update_cache: yes
    state: latest

