- name: "Don't configure Nginx. Only add example"
  block:
    - name: "Create SIP3 Hoof directory"
      ansible.builtin.file:
        path: /etc/sip3-hoof
        state: directory
        mode: '0755'

    - name: "Nginx config for SIP3 Hoof"
      ansible.builtin.copy:
        content: "{{ item['value'] }}"
        dest: "{{ item['name'] }}"
      loop:
        - name: "/etc/sip3-hoof/sip3-hoof.conf"
          value: "{{ hoof.sip3_hoof }}"

    - name: "Attention to Nginx configuration"
      debug:
        msg: "Example of SIP3 Nginx configuration is located in /etc/sip3-hoof/sip3-hoof.conf. Please check it and add to Nginx manually"
  when: hoof.nginx is not defined

- name: "Scratch Nginx configure"
  block:
    - name: "Configure Nginx for SIP3"
      ansible.builtin.copy:
        content: "{{ item['value'] }}"
        dest: "{{ item['name'] }}"
      loop:
        - name: "/etc/nginx/nginx.conf"
          value: "{{ hoof.nginx }}"

    - name: "Check default.conf file"
      ansible.builtin.stat:
        path: "/etc/nginx/conf.d/default.conf"
      register: src

    - name: "Backup Nginx original default.conf"
      block:
        - name: "Backup default.conf"
          ansible.builtin.copy:
            src: "/etc/nginx/conf.d/default.conf"
            dest: "/etc/nginx/conf.d/default.conf_sip3.{{ ansible_date_time.epoch }}"
            remote_src: true
            mode: preserve

        - name: "Remove the original"
          ansible.builtin.file:
            path: "/etc/nginx/conf.d/default.conf"
            state: absent
      when: src.stat.exists and src.stat.isreg

    - name: "Nginx config for SIP3 Hoof"
      ansible.builtin.copy:
        content: "{{ item['value'] }}"
        dest: "{{ item['name'] }}"
      loop:
        - name: "/etc/nginx/conf.d/sip3-hoof.conf"
          value: "{{ hoof.sip3_hoof }}"

    - name: "Restart NGINX"
      systemd:
        name: nginx
        daemon_reload: true
        state: restarted
        enabled: true
  when: hoof.nginx is defined