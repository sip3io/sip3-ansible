- name: "SIP3 Captain config"
  ansible.builtin.copy:
    content: "{{ item['value'] }}"
    dest: "{{ item['name'] }}"
  loop:
    - name: "/etc/sip3-captain/application.yml"
      value: "{{ captain.application | to_nice_yaml }}"
    - name: "/etc/sip3-captain/environment.conf"
      value: "{{ captain.environment }}"
    - name: "/etc/sip3-captain/logback.xml"
      value: "{{ captain.logback }}"

- name: "Restart SIP3 Captain"
  systemd:
    name: sip3-captain
    daemon_reload: true
    state: restarted
    enabled: true