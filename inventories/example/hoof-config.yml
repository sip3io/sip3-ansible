all:
  vars:
    hoof:
      sip3_api_uri: http://127.0.0.1:8080
      sip3_api_user: user
      sip3_api_password: password

      config:
        name: hoof
        type: hoof
        time_zones:
          - label: UTC
            name: (UTC) Greenwich Mean Time
            value: 'UTC'
        winbox:
          auto_close: false
        sidebar:
          dashboards:
            - order: 0
              name: Technical Dashboard
              type: external
              url: '/dashboard/technical'
              icon: /assets/page-icons/TechnicalDashboard.svg
            - order: 1
              name: SIP Metrics
              type: external
              url: '/dashboard/sip-metrics'
              icon: /assets/page-icons/CustomDashboard.svg
          searches:
            - order: 0
              name: Simple Search
              type: internal
              url: /search/simple
              icon: /assets/page-icons/SimpleSearch.svg
            - order: 1
              name: Advanced Search
              type: internal
              url: /search/advanced
              icon: /assets/page-icons/AdvancedSearch.svg
          links:
            - order: 0
              name: Documentation
              type: external
              url: 'https://sip3.io/documentation'
              icon: /assets/page-icons/Documentation.svg
            - order: 1
              name: API
              type: external
              url: '/api/swagger-ui/'
              icon: /assets/page-icons/ExternalLink.svg
        features:
          - experimental
        root_path: ''
        media:
          distance_threshold: 200
        default_route: /search/advanced
        oauth2:
          enabled: false
          provider: sip3